name: Funcom
description: 'Funcom is a Norwegian video-game developer and publisher founded in
  1993, headquartered in Oslo with additional studios in Raleigh (North Carolina),
  Lisbon, and Bucharest. It is best known for online, open-world, and survival titles
  including Dune: Awakening, Conan Exiles, Age of Conan, and The Secret World / Secret
  World Legends, alongside published titles such as Metal: Hellsinger, Aloft, Dune:
  Spice Wars, and Mutant Year Zero. Funcom is majority-owned by Tencent. It was surfaced
  as a Northzone portfolio company and added to the API Evangelist network as a company
  profile; it does not currently publish a public developer API surface, so this profile
  captures company identity, legal/support links, and domain-security posture rather
  than API artifacts.'
